[project]
name = "road-damage-detection"
version = "0.1.0"
description = "Detección y clasificación de daños en vías (baches) con visión computacional"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
]
